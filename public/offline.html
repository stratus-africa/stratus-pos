<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>StratusPOS — Offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      main { width: min(92vw, 420px); text-align: center; padding: 32px; box-sizing: border-box; }
      .icon { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0 0 24px; color: #64748b; line-height: 1.5; }
      button { border: 0; border-radius: 10px; padding: 11px 18px; background: #0f766e; color: white; font-weight: 600; cursor: pointer; }
      @media (prefers-color-scheme: dark) { body { background: #0f172a; color: #f8fafc; } p { color: #94a3b8; } }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/icons/icon-192.png" alt="StratusPOS" />
      <h1>You're offline</h1>
      <p>StratusPOS couldn't reach the network. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
