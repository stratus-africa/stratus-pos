[build]
  # This project's lockfile is bun.lock — install with bun so the dependency
  # tree matches local/preview builds (npm would resolve a different Vite).
  command = "bun install --frozen-lockfile && bun run build"
  # The Nitro `netlify` preset (set in vite.config.ts) writes static assets to
  # `dist/` and the SSR handler to `.netlify/functions-internal/`.
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.2.23"
